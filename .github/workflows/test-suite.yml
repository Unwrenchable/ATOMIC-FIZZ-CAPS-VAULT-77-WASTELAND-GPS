name: Test Suite

on:
  pull_request:
  push:
    branches: [ main, realaiproject ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
      ANCHOR_WALLET: /home/runner/.config/solana/id.json

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      - name: Setup Wallet
        run: |
          mkdir -p /home/runner/.config/solana
          solana-keygen new --no-bip39-passphrase -o /home/runner/.config/solana/id.json

      - name: Verify Solana build tooling
        run: |
          solana --version
          rustup show
          which cargo-build-sbf || true
          cargo-build-sbf --version || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Check declare_id matches Anchor.toml
        run: node scripts/check-cluster-ids.js

      - name: Build Anchor Program
        run: anchor build --provider.cluster devnet -- --features devnet

      - name: Run Security Test Suite
        run: npm test
