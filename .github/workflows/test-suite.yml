name: Test Suite

on:
  pull_request:
  push:
    branches: [ main, realaiproject ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
      ANCHOR_WALLET: /home/runner/.config/solana/id.json

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI (CI-safe)
        run: |
          SOLANA_VERSION="v1.18.18"
          curl -L "https://github.com/solana-labs/solana/releases/download/$SOLANA_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release /usr/local/solana-release
          echo "/usr/local/solana-release/bin" >> "$GITHUB_PATH"
          export PATH="/usr/local/solana-release/bin:$PATH"
          solana --version

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      - name: Setup Wallet
        run: |
          mkdir -p /home/runner/.config/solana
          export PATH="/usr/local/solana-release/bin:$PATH"
          solana-keygen new --no-bip39-passphrase -o /home/runner/.config/solana/id.json

      - name: Verify Solana build tooling
        run: |
          export PATH="/usr/local/solana-release/bin:$PATH"
          solana --version
          rustup show
          which cargo-build-sbf || true
          cargo-build-sbf --version || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Sync Anchor Program IDs
        run: |
          export PATH="/usr/local/solana-release/bin:$PATH"
          anchor keys sync

      - name: Build Anchor Program
        run: |
          export PATH="/usr/local/solana-release/bin:$PATH"
          anchor build

      - name: Run Security Test Suite
        run: npm test
