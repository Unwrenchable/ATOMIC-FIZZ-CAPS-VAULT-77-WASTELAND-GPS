name: Deploy to Devnet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: devnet-deploy

    env:
      ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
      ANCHOR_WALLET: /home/runner/.config/solana/id.json

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      - name: Setup Wallet
        run: |
          mkdir -p ~/.config/solana
          echo "${{ secrets.SOLANA_KEYPAIR }}" > ~/.config/solana/id.json

      - name: Check declare_id matches Anchor.toml
        run: node scripts/check-cluster-ids.js

      - name: Build Program
        run: anchor build --provider.cluster devnet -- --features devnet

      - name: Deploy Program
        run: anchor deploy --provider.cluster devnet

      - name: Resolve Program ID
        id: program
        run: |
          if [ -f target/deploy/fizzcaps_onchain-keypair.json ]; then
            PROGRAM_ID=$(solana address -k target/deploy/fizzcaps_onchain-keypair.json)
          else
            # Fallback parser: read lines within [programs.devnet], extract fizzcaps_onchain quoted value, then keep first match.
            PROGRAM_ID=$(
              sed -nE '/^\[programs\.devnet\]/,/^\[/{s/^\s*fizzcaps_onchain\s*=\s*"([^"]+)".*$/\1/p}' Anchor.toml | head -n1
            )
          fi
          if [ -z "$PROGRAM_ID" ]; then
            echo "Unable to resolve fizzcaps_onchain program ID from build artifacts or Anchor.toml."
            echo "program_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "program_id=$PROGRAM_ID" >> "$GITHUB_OUTPUT"

      - name: Upload IDL
        if: steps.program.outputs.program_id != ''
        run: anchor idl upgrade "${{ steps.program.outputs.program_id }}" target/idl/fizzcaps_onchain.json --provider.cluster devnet
