name: Deploy to Devnet

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
      ANCHOR_WALLET: /home/runner/.config/solana/id.json

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI (CI-safe)
        run: |
          SOLANA_VERSION="v1.18.18"
          curl -L "https://github.com/solana-labs/solana/releases/download/$SOLANA_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana --version

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install latest
          avm use latest
          anchor --version

      - name: Setup Wallet
        run: |
          mkdir -p ~/.config/solana
          echo "${{ secrets.SOLANA_KEYPAIR }}" > ~/.config/solana/id.json

      - name: Build Program
        run: anchor build --provider.cluster devnet

      - name: Deploy Program
        run: anchor deploy --provider.cluster devnet

      - name: Resolve Program ID
        id: program
        run: |
          if [ -f target/deploy/fizzcaps_onchain-keypair.json ]; then
            PROGRAM_ID=$(solana address -k target/deploy/fizzcaps_onchain-keypair.json)
          else
            # Fallback parser: read lines within [programs.devnet], extract fizzcaps_onchain quoted value, then keep first match.
            PROGRAM_ID=$(
              sed -nE '/^\[programs\.devnet\]/,/^\[/{s/^\s*fizzcaps_onchain\s*=\s*"([^"]+)".*$/\1/p}' Anchor.toml | head -n1
            )
          fi
          if [ -z "$PROGRAM_ID" ]; then
            echo "Unable to resolve fizzcaps_onchain program ID from build artifacts or Anchor.toml."
            echo "program_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "program_id=$PROGRAM_ID" >> "$GITHUB_OUTPUT"

      - name: Upload IDL
        if: steps.program.outputs.program_id != ''
        run: anchor idl upgrade --provider.cluster devnet "${{ steps.program.outputs.program_id }}" target/idl/fizzcaps_onchain.json
