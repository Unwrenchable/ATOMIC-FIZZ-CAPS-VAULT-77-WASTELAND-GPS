name: Auto Update Program ID

on:
  workflow_run:
    workflows: ["Deploy to Devnet"]
    types:
      - completed

jobs:
  update-id:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Extract Program ID
        id: pid
        run: |
          PROGRAM_ID=$(grep -o '"[A-Za-z0-9]\{32,44\}"' apps/backend/target/deploy/fizzcaps_onchain-keypair.json | tr -d '"')
          echo "program_id=$PROGRAM_ID" >> $GITHUB_OUTPUT

      - name: Update Anchor.toml
        run: |
          sed -i "s/fizzcaps_onchain = \".*\"/fizzcaps_onchain = \"${{ steps.pid.outputs.program_id }}\"/g" apps/backend/Anchor.toml

      - name: Update TS Client
        run: |
          sed -i "s/export const PROGRAM_ID = \".*\"/export const PROGRAM_ID = \"${{ steps.pid.outputs.program_id }}\"/g" apps/backend/ts/programId.ts

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto-update program ID to ${{ steps.pid.outputs.program_id }}" || echo "No changes"
          git push
