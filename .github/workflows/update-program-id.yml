name: Auto Update Program ID

on:
  workflow_run:
    workflows: ["Deploy to Devnet"]
    types:
      - completed

jobs:
  update-id:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Program ID
        id: pid
        run: |
          if [ ! -f target/deploy/fizzcaps_onchain-keypair.json ]; then
            echo "Program keypair not found at target/deploy/fizzcaps_onchain-keypair.json; skipping update."
            echo "::warning::Program keypair not found; skipping auto-update"
            echo "program_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PROGRAM_ID=$(grep -o '"[A-Za-z0-9]\{32,44\}"' target/deploy/fizzcaps_onchain-keypair.json | tr -d '"')
          echo "program_id=$PROGRAM_ID" >> "$GITHUB_OUTPUT"

      - name: Update Anchor.toml
        if: steps.pid.outputs.program_id != ''
        run: |
          awk -v pid="${{ steps.pid.outputs.program_id }}" '
            BEGIN { in_devnet = 0 }
            /^\[programs\.devnet\]/ { in_devnet = 1; print; next }
            /^\[/ && in_devnet { in_devnet = 0 }
            in_devnet && /^\s*fizzcaps_onchain\s*=/ {
              sub(/"[^"]*"/, "\"" pid "\"")
            }
            { print }
          ' Anchor.toml > Anchor.toml.tmp && mv Anchor.toml.tmp Anchor.toml

      - name: Commit Changes
        if: steps.pid.outputs.program_id != ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Anchor.toml
          git commit -m "Auto-update program ID to ${{ steps.pid.outputs.program_id }}" || echo "No changes"
          git push
