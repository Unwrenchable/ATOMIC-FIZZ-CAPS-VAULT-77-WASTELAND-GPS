name: Auto Update Program ID

on:
  workflow_run:
    workflows: ["Deploy to Devnet"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-id:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract Program ID
        id: pid
        run: |
          if [ ! -f target/deploy/fizzcaps_onchain-keypair.json ]; then
            echo "Program keypair not found at target/deploy/fizzcaps_onchain-keypair.json; skipping update."
            echo "::warning::Program keypair not found; skipping auto-update"
            echo "program_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PROGRAM_ID=$(grep -o '"[A-Za-z0-9]\{32,44\}"' target/deploy/fizzcaps_onchain-keypair.json | tr -d '"')
          echo "program_id=$PROGRAM_ID" >> "$GITHUB_OUTPUT"

      - name: Refuse to rewrite the pinned devnet id
        if: steps.pid.outputs.program_id != ''
        run: |
          PINNED=$(awk '
            $0 == "[programs.devnet]" { grab=1; next }
            /^\[/ { if (grab) exit }
            grab && $1 == "fizzcaps_onchain" {
              gsub(/"/, "", $3); print $3; exit
            }
          ' Anchor.toml)
          echo "deployed=${{ steps.pid.outputs.program_id }}"
          echo "pinned=$PINNED"
          if [ "${{ steps.pid.outputs.program_id }}" != "$PINNED" ]; then
            echo "Refusing to rewrite Anchor.toml. declare_id and Anchor.toml are pinned."
            exit 1
          fi
          echo "Pinned devnet id matches the deployed program."
