name: Anchor Build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/anchor-build.yml
      - Anchor.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - programs/**
      - solana/**
      - tests/burn_test.js
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/anchor-build.yml
      - Anchor.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - programs/**
      - solana/**
      - tests/burn_test.js

concurrency:
  group: anchor-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
      ANCHOR_WALLET: /home/runner/.config/solana/id.json

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Install Solana CLI (Anchor-compatible)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify Solana Installation
        run: |
          solana --version
          command -v agave-install

      - name: Install Anchor
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      - name: Setup Solana Wallet
        run: |
          mkdir -p /home/runner/.config/solana
          solana-keygen new --force --no-bip39-passphrase -o /home/runner/.config/solana/id.json

      - name: Verify Solana build tooling
        run: |
          solana --version
          rustup show
          command -v cargo-build-sbf
          cargo-build-sbf --version

      - name: Sync Anchor Program IDs
        run: anchor keys sync

      - name: Build Anchor Program
        run: anchor build
