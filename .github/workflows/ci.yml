name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch to avoid queuing duplicate jobs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # Node.js: lint + test
  # Only runs when JS/backend/config files change.
  # ----------------------------------------------------------------
  node:
    name: Node lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Skip this job if only Solana/Rust/docs changed
    if: |
      github.event_name == 'push' ||
      !startsWith(github.event.pull_request.title, 'chore(solana)')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          # Cache node_modules keyed on package-lock.json so installs are
          # skipped entirely on cache hits.
          cache: 'npm'

      # Full install only for test/lint jobs that need dev dependencies.
      # Use ci (not install) for reproducible builds.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

  # ----------------------------------------------------------------
  # Solana / Anchor program build + test
  # Only runs when program source, Cargo.toml, or Anchor.toml change.
  # ----------------------------------------------------------------
  solana:
    name: Solana program build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Path filter: only trigger when Solana-related files change
    # (uses paths-filter action to avoid running Rust builds on every JS commit)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for Solana-related changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            solana:
              - 'programs/**'
              - 'Anchor.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'workers/**'
              - 'scripts/**'

      - name: Set up Rust toolchain (with incremental build cache)
        if: steps.filter.outputs.solana == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Cache the Cargo registry + build artefacts.
      # Key includes Cargo.lock so it busts when dependencies change but
      # reuses the cache across identical lockfiles (most PRs).
      - name: Cache Rust / Cargo artefacts
        if: steps.filter.outputs.solana == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Solana CLI
        if: steps.filter.outputs.solana == 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI (cached via cargo)
        if: steps.filter.outputs.solana == 'true'
        run: |
          if ! command -v avm &> /dev/null; then
            cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          fi
          avm install 0.32.1
          avm use 0.32.1

      - name: Create throwaway CI wallet (build only, never funded)
        if: steps.filter.outputs.solana == 'true'
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json

      - name: Check declare_id matches Anchor.toml
        if: steps.filter.outputs.solana == 'true'
        run: node scripts/check-cluster-ids.js

      - name: Check exactly one cluster feature
        if: steps.filter.outputs.solana == 'true'
        run: bash scripts/check-cluster-features.sh

      - name: Build Anchor program (devnet id, no keys sync)
        if: steps.filter.outputs.solana == 'true'
        run: anchor build --provider.cluster devnet -- --features devnet

      # Localnet claim tests, including the Metaplex T1 gate, run in claim-loot-t1.yml.
