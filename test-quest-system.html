<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quest System Test - Atomic Fizz Caps</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #0f0;
      padding: 20px;
    }
    .test-section {
      border: 1px solid #0f0;
      padding: 15px;
      margin: 10px 0;
    }
    .pass { color: #0f0; }
    .fail { color: #f00; }
    .warn { color: #ff0; }
    button {
      background: #0f0;
      color: #000;
      border: none;
      padding: 8px 16px;
      margin: 5px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
    button:hover { background: #0c0; }
    #log {
      border: 1px solid #0f0;
      padding: 10px;
      margin-top: 20px;
      height: 400px;
      overflow-y: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>📟 QUEST SYSTEM DIAGNOSTIC</h1>
  
  <div class="test-section">
    <h2>1. Check Quest State Persistence</h2>
    <button onclick="testQuestStatePersistence()">Test Quest State Persistence</button>
    <div id="result-persistence"></div>
  </div>

  <div class="test-section">
    <h2>2. Test Quest Completion Flow</h2>
    <button onclick="testQuestCompletion()">Complete Wake Up Quest</button>
    <button onclick="checkRewards()">Check Rewards Applied</button>
    <div id="result-completion"></div>
  </div>

  <div class="test-section">
    <h2>3. Test Objective Tracking</h2>
    <button onclick="testObjectiveTracking()">Track Objectives</button>
    <div id="result-objectives"></div>
  </div>

  <div class="test-section">
    <h2>4. Test Backend Sync</h2>
    <button onclick="testBackendSync()">Test Backend Endpoints</button>
    <div id="result-backend"></div>
  </div>

  <div class="test-section">
    <h2>5. Test Reward Distribution</h2>
    <button onclick="testRewardDistribution()">Test Reward System</button>
    <div id="result-rewards"></div>
  </div>

  <div class="test-section">
    <h2>Controls</h2>
    <button onclick="clearAllData()">Clear All Quest Data</button>
    <button onclick="inspectStorage()">Inspect localStorage</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>

  <div id="log"></div>

  <script>
    // Mock minimal game environment
    window.Game = window.Game || {};
    window.Game.modules = window.Game.modules || {};
    window.Game.player = window.Game.player || { equipped: {} };
    window.gameState = window.gameState || { quests: {}, player: { xp: 0, caps: 0 }, inventory: {} };
    window.PLAYER = window.PLAYER || { xp: 0, caps: 0, inventory: [], questsActive: [], questsCompleted: [] };

    function log(msg, type = 'info') {
      const logDiv = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const color = type === 'error' ? '#f00' : type === 'warn' ? '#ff0' : type === 'success' ? '#0f0' : '#9f9';
      logDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(`[TEST] ${msg}`);
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    // TEST 1: Quest State Persistence
    function testQuestStatePersistence() {
      const resultDiv = document.getElementById('result-persistence');
      resultDiv.innerHTML = '<h3>Testing...</h3>';
      log('=== TEST 1: Quest State Persistence ===');
      
      const tests = [];
      
      // Check localStorage keys
      const keys = [
        'afc_player_state_v1',
        'afc_unified_player_state_v2',
        'afc_available_quests',
        'afc_equipped_items',
        'afc_starter_gear_given',
        'afc_wake_up_triggered'
      ];
      
      keys.forEach(key => {
        const value = localStorage.getItem(key);
        if (value) {
          log(`✓ Found ${key}: ${value.substring(0, 100)}...`, 'success');
          tests.push({ key, found: true, size: value.length });
        } else {
          log(`✗ Missing ${key}`, 'warn');
          tests.push({ key, found: false });
        }
      });
      
      // Check if quest state is in gameState
      log(`gameState.quests: ${JSON.stringify(window.gameState.quests || {})}`);
      
      // Test saving quest state
      log('Testing quest state save...');
      window.gameState.quests = window.gameState.quests || {};
      window.gameState.quests['test_quest'] = {
        state: 'active',
        currentStepIndex: 0,
        objectives: { test_obj: true }
      };
      
      // Check if any system saves this
      setTimeout(() => {
        const v1 = localStorage.getItem('afc_player_state_v1');
        const v2 = localStorage.getItem('afc_unified_player_state_v2');
        
        let saved = false;
        if (v1 && v1.includes('test_quest')) {
          log('✓ Quest state saved in v1', 'success');
          saved = true;
        }
        if (v2 && v2.includes('test_quest')) {
          log('✓ Quest state saved in v2', 'success');
          saved = true;
        }
        if (!saved) {
          log('✗ CRITICAL: Quest state NOT persisted to localStorage!', 'error');
        }
        
        resultDiv.innerHTML = `
          <h3 class="${saved ? 'pass' : 'fail'}">${saved ? 'PASS' : 'FAIL'}</h3>
          <pre>${JSON.stringify(tests, null, 2)}</pre>
        `;
      }, 100);
    }

    // TEST 2: Quest Completion Flow
    async function testQuestCompletion() {
      const resultDiv = document.getElementById('result-completion');
      resultDiv.innerHTML = '<h3>Testing...</h3>';
      log('=== TEST 2: Quest Completion Flow ===');
      
      // Check if quest modules exist
      const oldQuests = window.quests;
      const newQuests = window.Game?.modules?.quests;
      
      log(`Old quest system (quests.js): ${oldQuests ? 'FOUND' : 'NOT FOUND'}`, oldQuests ? 'success' : 'warn');
      log(`New quest system (modules/quests.js): ${newQuests ? 'FOUND' : 'NOT FOUND'}`, newQuests ? 'success' : 'warn');
      
      if (newQuests) {
        // Test new system
        log('Testing new quest system...');
        
        // Initialize if needed
        if (!newQuests.gs) {
          newQuests.init(window.gameState);
        }
        
        // Check wake_up quest
        const wakeUpState = newQuests.ensureQuestState('wake_up');
        log(`Wake Up quest state: ${JSON.stringify(wakeUpState)}`);
        
        // Start quest if not started
        if (wakeUpState.state === 'not_started') {
          log('Starting wake_up quest...');
          newQuests.startQuest('wake_up');
        }
        
        // Complete all objectives
        const objectives = ['open_inventory', 'equip_weapon', 'turn_on_radio', 'open_map'];
        objectives.forEach(obj => {
          const result = newQuests.completeObjective('wake_up', obj);
          log(`Complete objective ${obj}: ${result ? 'SUCCESS' : 'FAILED'}`, result ? 'success' : 'error');
        });
        
        // Check if quest completed
        setTimeout(() => {
          const finalState = newQuests.ensureQuestState('wake_up');
          log(`Final quest state: ${JSON.stringify(finalState)}`);
          
          resultDiv.innerHTML = `
            <h3 class="${finalState.state === 'completed' ? 'pass' : 'fail'}">
              ${finalState.state === 'completed' ? 'PASS' : 'FAIL'}
            </h3>
            <pre>${JSON.stringify(finalState, null, 2)}</pre>
          `;
        }, 100);
      } else if (oldQuests) {
        // Test old system
        log('Testing old quest system...');
        resultDiv.innerHTML = '<h3 class="warn">Old system found - needs migration</h3>';
      } else {
        log('No quest system found!', 'error');
        resultDiv.innerHTML = '<h3 class="fail">NO QUEST SYSTEM</h3>';
      }
    }

    // TEST 3: Objective Tracking
    function testObjectiveTracking() {
      const resultDiv = document.getElementById('result-objectives');
      log('=== TEST 3: Objective Tracking ===');
      
      const newQuests = window.Game?.modules?.quests;
      if (!newQuests) {
        resultDiv.innerHTML = '<h3 class="fail">Quest module not found</h3>';
        return;
      }
      
      const questState = newQuests.ensureQuestState('wake_up');
      log(`Quest objectives: ${JSON.stringify(questState.objectives)}`);
      
      const allTracked = questState.objectives && Object.keys(questState.objectives).length > 0;
      resultDiv.innerHTML = `
        <h3 class="${allTracked ? 'pass' : 'fail'}">${allTracked ? 'PASS' : 'FAIL'}</h3>
        <pre>${JSON.stringify(questState.objectives, null, 2)}</pre>
      `;
    }

    // TEST 4: Backend Sync
    async function testBackendSync() {
      const resultDiv = document.getElementById('result-backend');
      resultDiv.innerHTML = '<h3>Testing...</h3>';
      log('=== TEST 4: Backend Sync ===');
      
      const endpoints = [
        '/api/quests-store/list',
        '/api/quests-store/reveal',
        '/api/quests-store/lore/saitama'
      ];
      
      const results = [];
      
      for (const endpoint of endpoints) {
        try {
          log(`Testing ${endpoint}...`);
          const res = await fetch(endpoint);
          const data = await res.json();
          const success = res.ok;
          log(`${endpoint}: ${success ? 'OK' : 'FAILED'} (${res.status})`, success ? 'success' : 'error');
          results.push({ endpoint, status: res.status, ok: success });
        } catch (e) {
          log(`${endpoint}: ERROR - ${e.message}`, 'error');
          results.push({ endpoint, error: e.message });
        }
      }
      
      const allOk = results.every(r => r.ok);
      resultDiv.innerHTML = `
        <h3 class="${allOk ? 'pass' : 'warn'}">${allOk ? 'PASS' : 'PARTIAL'}</h3>
        <pre>${JSON.stringify(results, null, 2)}</pre>
      `;
    }

    // TEST 5: Reward Distribution
    function testRewardDistribution() {
      const resultDiv = document.getElementById('result-rewards');
      log('=== TEST 5: Reward Distribution ===');
      
      // Record initial values
      const initialXP = window.PLAYER?.xp || 0;
      const initialCaps = window.PLAYER?.caps || 0;
      const initialInvSize = window.PLAYER?.inventory?.length || 0;
      
      log(`Initial XP: ${initialXP}, Caps: ${initialCaps}, Inventory items: ${initialInvSize}`);
      
      // Simulate reward distribution
      const testRewards = { xp: 50, caps: 25, items: ['test_item_1', 'test_item_2'] };
      log(`Applying test rewards: ${JSON.stringify(testRewards)}`);
      
      // Check if PlayerState module exists
      const PlayerState = window.Game?.modules?.PlayerState;
      if (PlayerState) {
        log('Using PlayerState module for rewards...', 'success');
        PlayerState.awardXP(testRewards.xp);
        PlayerState.awardCaps(testRewards.caps);
        testRewards.items.forEach(itemId => {
          PlayerState.addItem({ id: itemId, name: itemId, type: 'test' });
        });
      } else {
        log('PlayerState module not found - using fallback', 'warn');
        window.PLAYER.xp += testRewards.xp;
        window.PLAYER.caps += testRewards.caps;
        testRewards.items.forEach(item => {
          if (!window.PLAYER.inventory.includes(item)) {
            window.PLAYER.inventory.push(item);
          }
        });
      }
      
      // Check results
      setTimeout(() => {
        const finalXP = window.PLAYER?.xp || 0;
        const finalCaps = window.PLAYER?.caps || 0;
        const finalInvSize = window.PLAYER?.inventory?.length || 0;
        
        log(`Final XP: ${finalXP}, Caps: ${finalCaps}, Inventory items: ${finalInvSize}`);
        
        const xpOk = finalXP >= initialXP + testRewards.xp;
        const capsOk = finalCaps >= initialCaps + testRewards.caps;
        const invOk = finalInvSize >= initialInvSize + testRewards.items.length;
        
        const allOk = xpOk && capsOk && invOk;
        
        resultDiv.innerHTML = `
          <h3 class="${allOk ? 'pass' : 'fail'}">${allOk ? 'PASS' : 'FAIL'}</h3>
          <div class="${xpOk ? 'pass' : 'fail'}">XP: ${initialXP} → ${finalXP} (expected +${testRewards.xp})</div>
          <div class="${capsOk ? 'pass' : 'fail'}">Caps: ${initialCaps} → ${finalCaps} (expected +${testRewards.caps})</div>
          <div class="${invOk ? 'pass' : 'fail'}">Inventory: ${initialInvSize} → ${finalInvSize} (expected +${testRewards.items.length})</div>
        `;
      }, 100);
    }

    // Check Rewards Applied
    function checkRewards() {
      const resultDiv = document.getElementById('result-completion');
      log('=== Checking Rewards ===');
      
      const v1 = localStorage.getItem('afc_player_state_v1');
      const v2 = localStorage.getItem('afc_unified_player_state_v2');
      
      let xp = 0, caps = 0;
      
      if (v1) {
        const data = JSON.parse(v1);
        log(`V1 Storage - XP: ${data.xp}, Caps: ${data.caps}`);
      }
      
      if (v2) {
        const data = JSON.parse(v2);
        log(`V2 Storage - XP: ${data.xp}, Caps: ${data.caps}`);
      }
      
      log(`PLAYER object - XP: ${window.PLAYER.xp}, Caps: ${window.PLAYER.caps}`);
      log(`Game.player - XP: ${window.Game?.player?.xp}, Caps: ${window.Game?.player?.caps}`);
    }

    // Utility Functions
    function clearAllData() {
      if (confirm('Clear all quest data? This will reset everything.')) {
        const keys = [
          'afc_player_state_v1',
          'afc_unified_player_state_v2',
          'afc_available_quests',
          'afc_equipped_items',
          'afc_starter_gear_given',
          'afc_wake_up_triggered',
          'afc_quests_initialized_session'
        ];
        keys.forEach(key => {
          localStorage.removeItem(key);
          sessionStorage.removeItem(key);
        });
        log('All quest data cleared!', 'warn');
        location.reload();
      }
    }

    function inspectStorage() {
      log('=== localStorage Inspection ===');
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('afc_')) {
          const value = localStorage.getItem(key);
          log(`${key}: ${value?.substring(0, 200)}...`);
        }
      }
    }

    // Auto-run basic checks on load
    window.addEventListener('load', () => {
      log('Quest System Diagnostic Loaded', 'success');
      log('Run tests to diagnose issues with quest tracking and rewards');
      inspectStorage();
    });
  </script>
</body>
</html>
