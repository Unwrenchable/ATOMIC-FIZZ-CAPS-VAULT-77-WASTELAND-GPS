[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
fizzcaps_onchain = "GvTeKyGiFqtpJn2cJQxFb2iPVCYotvnMjMZKGAnPgZkc"

[programs.localnet]
fizzcaps_onchain = "HnWTnCKuKhJa6cXj4ZocW2D8Jtf4f5QFb6f6UnkF27FB"

[programs.mainnet]
fizzcaps_onchain = "DXxzKfZh6aJCff7sEusMU1E9w4ZDwgJkYGgKStRRGRyP"

[provider]
# Default is devnet so builds, keys sync, tests and deploys never hit mainnet by accident.
cluster = "devnet"
# Mainnet deploys must be explicit: anchor deploy --provider.cluster mainnet ([programs.mainnet] is kept for that).
# After any mainnet deploy, verify the on-chain program ID matches [programs.mainnet].
wallet = "~/.config/solana/id.json"

[scripts]
test = "cd anchor-tests && npx ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.ts'"
test-root = "npm test"

[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = "anchor-tests/fixtures/mpl_token_metadata.so"

[hooks]
