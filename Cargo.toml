[workspace]
resolver = "2"
members = ["programs/fizzcaps_onchain"]
# Own lockfile. solana-program-test must not be resolved by cargo-build-sbf.
exclude = ["programs/claim-loot-local-test"]


[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = true

[profile.release.build-override]
opt-level = 3
codegen-units = 1
