[package]
name = "fizzcaps_onchain"
version = "0.1.0"
description = "Atomic Fizz Caps — $CAPS token + real-world loot NFT claims + Fizz.fun bonding curve launchpad"
edition = "2021"

[lib]
name = "fizzcaps_onchain"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[features]
# No default cluster. Exactly one of localnet/devnet/mainnet must be set
# (compile_error! in lib.rs). `cargo test --features localnet`.
# `anchor build -- --features devnet` adds devnet on top of an empty default.
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
localnet = []
devnet = []
mainnet = []

# Optional developer features
custom-heap    = []
custom-panic   = []
anchor-debug   = []
no-log-ix-name = []

[dependencies]
anchor-lang = "0.32"
anchor-spl = "0.32"
mpl-token-metadata = "5.1.1"
solana-sdk-ids = "2.2.1"
solana-sha256-hasher = "2.3.0"
