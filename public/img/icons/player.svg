<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#pg)">
    <!-- Outer locator ring -->
    <circle cx="32" cy="32" r="24" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.6"/>
    <!-- Directional arrowhead — tip points up (north at 0° heading) -->
    <polygon points="32,5 46,36 32,27 18,36" fill="#00ffcc" stroke="#003322" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Tail dot -->
    <circle cx="32" cy="44" r="5" fill="#00ffcc" stroke="#003322" stroke-width="1" opacity="0.8"/>
  </g>
</svg>
