<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    LONG: Hair flowing well past shoulders. Two wide side panels visible.
    Slight center part. Strand texture lines show hair direction.
    Gradient darkens toward tips for that faded post-apoc look.
  -->
  <defs>
    <linearGradient id="long_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#9A6A40"/>
      <stop offset="35%"  stop-color="#7A4A28"/>
      <stop offset="80%"  stop-color="#4A2810"/>
      <stop offset="100%" stop-color="#2A1008"/>
    </linearGradient>
    <linearGradient id="long_panelL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7A4A28"/>
      <stop offset="100%" stop-color="#2A1008"/>
    </linearGradient>
    <linearGradient id="long_panelR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7A4A28"/>
      <stop offset="100%" stop-color="#2A1008"/>
    </linearGradient>
  </defs>

  <!-- Far background body — connects both sides behind the head -->
  <path d="
    M 68,90
    Q 50,115  48,170
    Q 46,215  56,256
    L 200,256
    Q 210,215  208,170
    Q 206,115  188,90
    Q 158,82  128,80
    Q 98,82   68,90
    Z"
    fill="#3A1C08"/>

  <!-- Left side panel -->
  <path d="
    M 58,96
    Q 44,132  42,182
    Q 40,220  50,256
    L 76,256
    Q 68,228  70,186
    Q 72,142  80,108
    Q 70,102  58,96
    Z"
    fill="url(#long_panelL)"/>

  <!-- Right side panel -->
  <path d="
    M 198,96
    Q 212,132  214,182
    Q 216,220  206,256
    L 180,256
    Q 188,228  186,186
    Q 184,142  176,108
    Q 186,102  198,96
    Z"
    fill="url(#long_panelR)"/>

  <!-- Main top cap with center part -->
  <path d="
    M 56,96
    Q 46,63  68,45
    Q 94,30  128,28
    Q 162,30  188,45
    Q 210,63  200,96
    Q 178,84  128,81
    Q 78,84   56,96
    Z"
    fill="url(#long_grad)"/>

  <!-- Center part line -->
  <path d="M 128,28 L 128,96"
        fill="none" stroke="#3D2010" stroke-width="2"
        stroke-linecap="round" opacity="0.55"/>

  <!-- Crown highlights flanking the part -->
  <path d="M 90,46  Q 108,36 127,34"
        fill="none" stroke="#C08855" stroke-width="3"
        stroke-linecap="round" opacity="0.52"/>
  <path d="M 166,46 Q 148,36 129,34"
        fill="none" stroke="#C08855" stroke-width="3"
        stroke-linecap="round" opacity="0.52"/>

  <!-- Hairline shadow edge -->
  <path d="M 56,96 Q 78,86 128,83 Q 178,86 200,96"
        fill="none" stroke="#3D2010" stroke-width="2"
        stroke-linecap="round" opacity="0.50"/>

  <!-- Strand texture lines on side panels -->
  <g fill="none" stroke="#2A1008" stroke-width="1.3"
     stroke-linecap="round" opacity="0.45">
    <!-- Left panel strands -->
    <path d="M 60,108  Q 50,148  50,196"/>
    <path d="M 72,104  Q 64,144  64,192"/>
    <!-- Right panel strands -->
    <path d="M 196,108 Q 206,148 206,196"/>
    <path d="M 184,104 Q 192,144 192,192"/>
  </g>
</svg>
