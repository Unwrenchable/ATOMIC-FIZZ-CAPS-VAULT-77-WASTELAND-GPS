<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="beardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="100%" stop-color="#2a1a0a"/>
    </linearGradient>
    <radialGradient id="hairDensity" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#4a3a2a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2a1a0a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  
  <!-- Full beard coverage -->
  <path d="M88 145c-8 6-12 14-12 24c0 12 6 22 16 28c12 8 28 12 44 10c14-2 26-8 34-18c6-8 8-18 6-28c-2-8-8-14-16-16" 
        fill="url(#beardGrad)" stroke="#1a0a00" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Extended jaw coverage -->
  <ellipse cx="128" cy="175" rx="38" ry="28" fill="url(#beardGrad)" opacity="0.95"/>
  
  <!-- Mustache -->
  <path d="M95 145c6-2 12-2 18-2h30c6 0 12 0 18 2" 
        stroke="url(#beardGrad)" stroke-width="4" fill="url(#hairDensity)" stroke-linecap="round"/>
  
  <!-- Hair texture and depth -->
  <g opacity="0.4" stroke="#1a0a00" stroke-width="0.8" fill="none">
    <path d="M85 150c5 8 10 16 15 22"/>
    <path d="M95 155c4 10 8 18 12 24"/>
    <path d="M110 165c3 8 6 15 9 20"/>
    <path d="M146 165c-3 8-6 15-9 20"/>
    <path d="M161 155c-4 10-8 18-12 24"/>
    <path d="M171 150c-5 8-10 16-15 22"/>
  </g>
  
  <!-- Individual hair strands for realism -->
  <g opacity="0.6" stroke="#2a1a0a" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M90 148c2 6 4 12 6 18"/>
    <path d="M98 152c2 8 4 16 6 22"/>
    <path d="M108 160c1 7 3 14 5 20"/>
    <path d="M120 165c0 8 1 16 3 22"/>
    <path d="M136 165c0 8-1 16-3 22"/>
    <path d="M148 160c-1 7-3 14-5 20"/>
    <path d="M158 152c-2 8-4 16-6 22"/>
    <path d="M166 148c-2 6-4 12-6 18"/>
  </g>
  
  <!-- Chin hair detail -->
  <ellipse cx="128" cy="195" rx="20" ry="12" fill="url(#beardGrad)" opacity="0.9"/>
  
  <!-- Gray/weathered patches (wasteland aging) -->
  <g opacity="0.3" fill="#6a5a4a">
    <ellipse cx="92" cy="168" rx="4" ry="6"/>
    <ellipse cx="164" cy="172" rx="4" ry="6"/>
    <ellipse cx="128" cy="185" rx="5" ry="4"/>
  </g>
  
  <!-- Beard edges -->
  <path d="M82 147c-6 8-9 18-8 28c1 10 6 18 13 24" 
        fill="none" stroke="#4a3a2a" stroke-width="1" opacity="0.5"/>
  
  <path d="M174 147c6 8 9 18 8 28c-1 10-6 18-13 24" 
        fill="none" stroke="#4a3a2a" stroke-width="1" opacity="0.5"/>
</svg>
