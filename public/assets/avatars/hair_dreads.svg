<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    DREADLOCKS: Multiple thick rope-like dreads hanging down. Each dread
    has the characteristic knotted/wrapped look via elliptical ring marks.
    Fat cylindrical shapes, clearly different from the thin braid weave.
    5 visible dreads of varying lengths.
  -->
  <defs>
    <linearGradient id="drd_capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#9A6A40"/>
      <stop offset="100%" stop-color="#5A3220"/>
    </linearGradient>
    <linearGradient id="drd_dreadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5A3520"/>
      <stop offset="40%"  stop-color="#8B5E3C"/>
      <stop offset="100%" stop-color="#4A2810"/>
    </linearGradient>
  </defs>

  <!-- DREAD 1 — far left, x≈72, shorter -->
  <path d="
    M 62,118  Q 58,145  60,175  Q 62,200  72,210
    Q 82,200  84,175  Q 86,145  82,118  Z"
    fill="url(#drd_dreadGrad)"/>
  <g fill="#3D2010" opacity="0.42">
    <ellipse cx="72" cy="133" rx="9" ry="3.5"/>
    <ellipse cx="72" cy="150" rx="9" ry="3.5"/>
    <ellipse cx="72" cy="167" rx="9" ry="3.5"/>
    <ellipse cx="72" cy="184" rx="9" ry="3.5"/>
    <ellipse cx="72" cy="198" rx="7" ry="3"/>
  </g>
  <path d="M 72,120 L 72,205" fill="none" stroke="#A06838"
        stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <path d="M 64,205 Q 68,212 72,214 Q 76,212 80,205"
        fill="#2A1008" opacity="0.80"/>

  <!-- DREAD 2 — left-center, x≈100, longest left -->
  <path d="
    M 90,116  Q 86,148  88,184  Q 90,216  100,228
    Q 110,216  112,184  Q 114,148  110,116  Z"
    fill="url(#drd_dreadGrad)"/>
  <g fill="#3D2010" opacity="0.42">
    <ellipse cx="100" cy="131" rx="10" ry="3.5"/>
    <ellipse cx="100" cy="150" rx="10" ry="3.5"/>
    <ellipse cx="100" cy="169" rx="10" ry="3.5"/>
    <ellipse cx="100" cy="188" rx="10" ry="3.5"/>
    <ellipse cx="100" cy="207" rx="9"  ry="3"/>
    <ellipse cx="100" cy="220" rx="7"  ry="3"/>
  </g>
  <path d="M 100,118 L 100,222" fill="none" stroke="#A06838"
        stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <path d="M 92,220 Q 96,228 100,230 Q 104,228 108,220"
        fill="#2A1008" opacity="0.80"/>

  <!-- DREAD 3 — center, x=128, medium -->
  <path d="
    M 118,116  Q 114,148  116,180  Q 118,210  128,220
    Q 138,210  140,180  Q 142,148  138,116  Z"
    fill="url(#drd_dreadGrad)"/>
  <g fill="#3D2010" opacity="0.42">
    <ellipse cx="128" cy="132" rx="10" ry="3.5"/>
    <ellipse cx="128" cy="151" rx="10" ry="3.5"/>
    <ellipse cx="128" cy="170" rx="10" ry="3.5"/>
    <ellipse cx="128" cy="189" rx="10" ry="3.5"/>
    <ellipse cx="128" cy="205" rx="8"  ry="3"/>
  </g>
  <path d="M 128,118 L 128,215" fill="none" stroke="#A06838"
        stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <path d="M 120,210 Q 124,220 128,222 Q 132,220 136,210"
        fill="#2A1008" opacity="0.80"/>

  <!-- DREAD 4 — right-center, x≈156, longest right -->
  <path d="
    M 146,116  Q 142,148  144,184  Q 146,216  156,228
    Q 166,216  168,184  Q 170,148  166,116  Z"
    fill="url(#drd_dreadGrad)"/>
  <g fill="#3D2010" opacity="0.42">
    <ellipse cx="156" cy="131" rx="10" ry="3.5"/>
    <ellipse cx="156" cy="150" rx="10" ry="3.5"/>
    <ellipse cx="156" cy="169" rx="10" ry="3.5"/>
    <ellipse cx="156" cy="188" rx="10" ry="3.5"/>
    <ellipse cx="156" cy="207" rx="9"  ry="3"/>
    <ellipse cx="156" cy="220" rx="7"  ry="3"/>
  </g>
  <path d="M 156,118 L 156,222" fill="none" stroke="#A06838"
        stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <path d="M 148,220 Q 152,228 156,230 Q 160,228 164,220"
        fill="#2A1008" opacity="0.80"/>

  <!-- DREAD 5 — far right, x≈184, shorter -->
  <path d="
    M 174,118  Q 170,145  172,175  Q 174,200  184,210
    Q 194,200  196,175  Q 198,145  194,118  Z"
    fill="url(#drd_dreadGrad)"/>
  <g fill="#3D2010" opacity="0.42">
    <ellipse cx="184" cy="133" rx="9" ry="3.5"/>
    <ellipse cx="184" cy="150" rx="9" ry="3.5"/>
    <ellipse cx="184" cy="167" rx="9" ry="3.5"/>
    <ellipse cx="184" cy="184" rx="9" ry="3.5"/>
    <ellipse cx="184" cy="198" rx="7" ry="3"/>
  </g>
  <path d="M 184,120 L 184,205" fill="none" stroke="#A06838"
        stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <path d="M 176,205 Q 180,212 184,214 Q 188,212 192,205"
        fill="#2A1008" opacity="0.80"/>

  <!-- Top cap -->
  <path d="
    M 58,102
    Q 48,68  68,48
    Q 94,32  128,30
    Q 162,32  188,48
    Q 208,68  198,102
    Q 178,90  128,87
    Q 78,90   58,102
    Z"
    fill="url(#drd_capGrad)"/>

  <!-- Crown highlight -->
  <path d="M 96,48 Q 112,38 128,36 Q 144,38 160,48"
        fill="none" stroke="#B87848" stroke-width="3.5"
        stroke-linecap="round" opacity="0.48"/>

  <!-- Hairline shadow -->
  <path d="M 58,102 Q 78,92 128,89 Q 178,92 198,102"
        fill="none" stroke="#3D2010" stroke-width="2"
        stroke-linecap="round" opacity="0.50"/>
</svg>
