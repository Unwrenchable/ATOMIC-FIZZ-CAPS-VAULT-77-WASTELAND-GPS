<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    SLICKED BACK: Hair combed tightly backward with pomade/oil. Very flat,
    low-profile cap. Broad shine/highlight stripe running front-to-back.
    Hairlines all sweep dramatically toward the rear. Polished vault-dweller look.
  -->
  <defs>
    <linearGradient id="slk_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8A5A38"/>
      <stop offset="55%"  stop-color="#5A3520"/>
      <stop offset="100%" stop-color="#3D2010"/>
    </linearGradient>
    <linearGradient id="slk_shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D4A870" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#D4A870" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Main cap — very flat profile, front hairline is fairly low (~y=95) -->
  <path d="
    M 60,95
    Q 50,62  70,44
    Q 96,28  128,26
    Q 160,28  186,44
    Q 206,62  196,95
    Q 174,86  128,84
    Q 82,86   60,95
    Z"
    fill="url(#slk_grad)"/>

  <!-- Primary pomade shine stripe — wide, smooth, runs crown-to-back -->
  <path d="M 72,52 Q 100,40 128,38 Q 156,40 184,52"
        fill="none" stroke="url(#slk_shine)" stroke-width="7"
        stroke-linecap="round"/>
  <!-- Secondary narrower shine -->
  <path d="M 84,55 Q 106,46 128,44 Q 150,46 172,55"
        fill="none" stroke="#D4A870" stroke-width="2.5"
        stroke-linecap="round" opacity="0.35"/>

  <!-- Crown root shadow (hair is very flat here) -->
  <ellipse cx="128" cy="50" rx="56" ry="12" fill="#3D2010" opacity="0.18"/>

  <!-- Back-sweep texture lines — all pointing toward the rear -->
  <g fill="none" stroke="#3D2010" stroke-width="1.3"
     stroke-linecap="round" opacity="0.38">
    <path d="M 66,58  Q 97,50  128,48 Q 159,50 190,58"/>
    <path d="M 62,68  Q 95,60  128,58 Q 161,60 194,68"/>
    <path d="M 60,78  Q 94,70  128,68 Q 162,70 196,78"/>
    <path d="M 60,87  Q 94,80  128,78 Q 162,80 196,87"/>
  </g>

  <!-- Left sideburn — slicked back tight against skull -->
  <path d="M 60,95 Q 52,108 54,120 Q 57,113 63,104 Q 62,100 60,95 Z"
        fill="#4A2810" opacity="0.65"/>
  <!-- Right sideburn -->
  <path d="M 196,95 Q 204,108 202,120 Q 199,113 193,104 Q 194,100 196,95 Z"
        fill="#4A2810" opacity="0.65"/>

  <!-- Hairline shadow edge (very clean, straight) -->
  <path d="M 60,95 Q 82,88 128,86 Q 174,88 196,95"
        fill="none" stroke="#3D2010" stroke-width="2"
        stroke-linecap="round" opacity="0.55"/>
</svg>
