<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    SHORT: Classic short cut. ~25 px thick at top. Side-swept direction with
    visible texture arcs. Distinct from buzzcut — hairline is lower, hair
    has more body and a slight lateral lean.
  -->
  <defs>
    <linearGradient id="short_grad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#A87848"/>
      <stop offset="100%" stop-color="#5A3520"/>
    </linearGradient>
  </defs>

  <!-- Main cap — lower hairline (~y=98) more body than buzzcut -->
  <path d="
    M 58,98
    Q 48,68  67,49
    Q 93,33  128,31
    Q 163,33  189,49
    Q 208,68  198,98
    Q 177,86  128,83
    Q 79,86   58,98
    Z"
    fill="url(#short_grad)"/>

  <!-- Temple bulk — slightly thicker at the sides -->
  <path d="M 58,98 Q 50,112 54,128 Q 57,118 65,107 Q 62,103 58,98 Z"
        fill="#6B3E22" opacity="0.65"/>
  <path d="M 198,98 Q 206,112 202,128 Q 199,118 191,107 Q 194,103 198,98 Z"
        fill="#6B3E22" opacity="0.65"/>

  <!-- Crown shadow (darker roots) -->
  <ellipse cx="128" cy="55" rx="54" ry="16" fill="#3D2010" opacity="0.16"/>

  <!-- Crown highlight -->
  <path d="M 98,48 Q 113,39 128,37 Q 143,39 158,48"
        fill="none" stroke="#C08855" stroke-width="3.5"
        stroke-linecap="round" opacity="0.50"/>

  <!-- Hairline shadow edge -->
  <path d="M 58,98 Q 79,89 128,86 Q 177,89 198,98"
        fill="none" stroke="#3D2010" stroke-width="2"
        stroke-linecap="round" opacity="0.50"/>

  <!-- Swept texture lines — hair flows slightly right (side-part look) -->
  <g fill="none" stroke="#3D2010" stroke-width="1.2"
     stroke-linecap="round" opacity="0.32">
    <path d="M 76,67  Q 102,60 128,59 Q 154,60 176,67"/>
    <path d="M 68,77  Q 97,70  128,68 Q 159,70 188,77"/>
    <path d="M 64,87  Q 95,80  128,78 Q 161,80 192,87"/>
    <path d="M 62,94  Q 94,87  128,85 Q 162,87 194,94"/>
  </g>
</svg>
