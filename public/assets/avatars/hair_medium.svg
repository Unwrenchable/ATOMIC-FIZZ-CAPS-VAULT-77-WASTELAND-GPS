<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    MEDIUM: Hair reaches jaw/cheek level. Side locks visible on cheeks.
    Behind-the-head panel drawn first, then side locks, then top cap.
    Clearly different silhouette from short — wider side panels.
  -->
  <defs>
    <linearGradient id="med_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#9A6A40"/>
      <stop offset="55%"  stop-color="#6B3E22"/>
      <stop offset="100%" stop-color="#3D1C08"/>
    </linearGradient>
    <linearGradient id="med_sideGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7A4A28"/>
      <stop offset="100%" stop-color="#3D1C08"/>
    </linearGradient>
  </defs>

  <!-- Back-of-head panel (behind face layer) — ear-to-ear, hangs to jaw -->
  <path d="
    M 64,100
    Q 50,130  52,168
    Q 54,195  68,210
    Q 88,220  90,215
    Q 72,202  70,178
    Q 66,148  68,118
    Q 64,110  64,100
    Z"
    fill="#4A2810"/>
  <path d="
    M 192,100
    Q 206,130  204,168
    Q 202,195  188,210
    Q 168,220  166,215
    Q 184,202  186,178
    Q 190,148  188,118
    Q 192,110  192,100
    Z"
    fill="#4A2810"/>

  <!-- Side locks extending down cheeks (in front of face, drawn after cap) -->
  <!-- Left cheek lock -->
  <path d="
    M 60,100
    Q 48,130  50,165
    Q 52,188  62,200
    Q 68,193  68,175
    Q 66,148  70,120
    Q 65,110  60,100
    Z"
    fill="url(#med_sideGrad)"/>
  <!-- Right cheek lock -->
  <path d="
    M 196,100
    Q 208,130  206,165
    Q 204,188  194,200
    Q 188,193  188,175
    Q 190,148  186,120
    Q 191,110  196,100
    Z"
    fill="url(#med_sideGrad)"/>

  <!-- Main top cap -->
  <path d="
    M 58,100
    Q 48,67  68,48
    Q 93,32  128,30
    Q 163,32  188,48
    Q 208,67  198,100
    Q 177,88  128,85
    Q 79,88   58,100
    Z"
    fill="url(#med_grad)"/>

  <!-- Crown shadow -->
  <ellipse cx="128" cy="57" rx="55" ry="17" fill="#3D2010" opacity="0.16"/>

  <!-- Crown highlight -->
  <path d="M 96,48 Q 112,38 128,36 Q 144,38 160,48"
        fill="none" stroke="#B87848" stroke-width="3.5"
        stroke-linecap="round" opacity="0.48"/>

  <!-- Hairline shadow edge -->
  <path d="M 58,100 Q 79,90 128,87 Q 177,90 198,100"
        fill="none" stroke="#3D2010" stroke-width="2"
        stroke-linecap="round" opacity="0.50"/>

  <!-- Side-lock strand lines -->
  <g fill="none" stroke="#3D2010" stroke-width="1.3"
     stroke-linecap="round" opacity="0.38">
    <path d="M 60,108 Q 52,135 54,165"/>
    <path d="M 68,106 Q 60,132 62,162"/>
    <path d="M 192,108 Q 200,135 198,165"/>
    <path d="M 184,106 Q 192,132 190,162"/>
  </g>
</svg>
