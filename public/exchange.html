<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SCAVENGER'S EXCHANGE • ATOMIC FIZZ CAPS</title>

  <!-- CSP: All required hashes included -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.gstatic.com https://www.googletagmanager.com https://api.phantom.app https://*.phantom.app https://wallet.phantom.app

      'sha256-RKPZWgvMlMXlDlyqgBTkFok8+J/6Dwd8uWypHc9RTq4=' 
      'sha256-ifhM87Ts8YPjA9BFs7MOrEywjqLlp0CZBKWaOppr1fE=' 
      'sha256-QZ2UtJkPyVaVpO87TjOtPsu5XUuzvb/kBvJrg3lPegQ=' 
      'sha256-ht4bn3PtoOPOPNMxHc97QDZz/8/D3tGE3jfXNxJ9b6s=' 
      'sha256-zsi031c7UsmAaEs6ZwrWyX7dERfVA+d2kUv9D434WHk=' 
      'sha256-Bq0L5gIP48ZOyBGfM9ydoqp7P9L7Hg4E2Masn1AFDd8=';
    connect-src 'self' https://unpkg.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://atomicfizzcaps.xyz https://www.atomicfizzcaps.xyz https://api.mainnet-beta.solana.com https://api.devnet.solana.com https://api.phantom.app https://*.phantom.app https://wallet.phantom.app wss: https://*;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;

    font-src 'self' https://fonts.gstatic.com data:;
    media-src 'self' data: https:;
    object-src 'none';
    frame-src 'self';
    base-uri 'self';">

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/pipboy.css" />

  <style>
    body { background: #0a1f0a; color: #00ff41; font-family: 'VT323', monospace; margin: 0; padding: 0; }
    .exchange-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      border: 2px solid #00ff41;
      background: rgba(0, 0, 0, 0.7);
    }
    h1 { text-align: center; text-shadow: 0 0 10px #00ff41; }
    .trade-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .trade-card {
      background: rgba(0, 255, 65, 0.1);
      border: 1px solid #00ff41;
      padding: 15px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .trade-card:hover { box-shadow: 0 0 15px #00ff41; transform: translateY(-3px); }
    .trade-card h3 { margin: 0 0 10px; color: #00ff99; }
    .trade-card .price { font-size: 1.4em; color: #ffcc00; }
    .trade-card button {
      background: #00cc33;
      color: black;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      margin-top: 10px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.9em;
    }
    .trade-card button:hover { background: #00ff66; }
    .new-trade-form { margin: 40px 0; padding: 20px; background: rgba(0, 255, 65, 0.08); border: 1px dashed #00ff41; }
    #nftSelector { margin: 20px 0; padding: 15px; background: rgba(0,255,65,0.05); border: 1px solid #00ff41; }
    .nft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    .nft-card { border: 1px solid #00ff41; padding: 10px; text-align: center; cursor: pointer; }
    .nft-card img { width: 100%; height: 120px; object-fit: cover; }
  </style>
</head>
<body>

  <div class="exchange-container">
    <h1>SCAVENGER'S EXCHANGE</h1>
    <p style="text-align:center;">Post your trades • Buy from other wastelanders • Powered by Solana</p>

    <!-- Workbench shortcut -->
    <div style="text-align:center; margin:14px 0;">
      <a href="/workbench" target="workbench_terminal"
         style="display:inline-block; padding:10px 22px; background:#003300; color:#00ff41; border:1px solid #00ff41; font-family:'Press Start 2P',cursive; font-size:0.7em; text-decoration:none; cursor:pointer;"
         onclick="var f='resizable=yes,scrollbars=yes,width=900,height=800,left='+Math.floor((screen.width-900)/2)+',top='+Math.floor((screen.height-800)/2); window.open('/workbench','workbench_terminal',f); return false;">
        🔧 ARMOR WORKBENCH → Craft &amp; Assemble Gear Here
      </a>
    </div>

    <!-- Wallet status -->
    <div id="walletStatus" style="text-align:center; margin:20px 0;">
      <button id="connectWalletBtn">Connect Solana Wallet</button>
      <span id="walletAddr"></span>
    </div>

    <!-- List NFT Button -->
    <button id="listNftBtn" disabled style="display:block; margin:20px auto; padding:12px 24px; background:#006619; color:#00ff41; border:1px solid #00ff41; font-family:'Press Start 2P',cursive; cursor:not-allowed; opacity:0.5;">
      List My NFT for Sale/Trade
    </button>

    <!-- NFT Selector (hidden until button clicked) -->
    <div id="nftSelector" class="hidden">
      <h3>Your NFTs</h3>
      <div id="nftGrid" class="nft-grid"></div>
    </div>

    <!-- New trade form (for non-NFT trades) -->
    <div class="new-trade-form">
      <h2>Post a New Trade (Items/CAPS)</h2>
      <form id="newTradeForm">
        <label>Item you offer:</label><br>
        <input type="text" id="offerItem" placeholder="e.g. 50 Stimpaks" required style="width:100%; padding:8px; margin:8px 0;" /><br>

        <label>Price (in FIZZ tokens):</label><br>
        <input type="number" id="price" min="0.01" step="0.01" placeholder="e.g. 0.5" required style="width:100%; padding:8px; margin:8px 0;" /><br>

        <label>Your message / description:</label><br>
        <textarea id="description" rows="3" placeholder="Fresh stimpaks, no rads..." style="width:100%; padding:8px;"></textarea><br>

        <button type="submit">Post Trade</button>
      </form>
    </div>

    <!-- Active trades list -->
    <h2>Active Trades</h2>
    <div id="tradeList" class="trade-list">
      <div class="trade-card"><h3>Loading trades...</h3></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <script src="/js/lib/bs58.js"></script>
  <script src="/js/modules/web3-wallet-adapter.js" defer></script>
  <script>
    const connectBtn = document.getElementById('connectWalletBtn');
    const walletAddrEl = document.getElementById('walletAddr');
    const listNftBtn = document.getElementById('listNftBtn');
    const nftSelector = document.getElementById('nftSelector');
    const nftGrid = document.getElementById('nftGrid');
    let connectedWallet = null;

    // XSS guard: escape text before inserting into innerHTML
    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = String(str == null ? '' : str);
      return d.innerHTML;
    }

    // Connect Wallet
    connectBtn.addEventListener('click', async () => {
      try {
        // Try universal web3 wallet adapter first
        if (window.Game && window.Game.modules && window.Game.modules.web3WalletAdapter) {
          const adapter = window.Game.modules.web3WalletAdapter;
          const success = await adapter.connect();
          if (success) {
            connectedWallet = adapter.walletAddress;
            walletAddrEl.textContent = `Connected: ${connectedWallet.slice(0,6)}...${connectedWallet.slice(-4)} (${adapter.walletType})`;
            connectBtn.disabled = true;
            // Enable NFT listing button and restore normal styling
            listNftBtn.disabled = false;
            listNftBtn.style.background = '#00cc33';
            listNftBtn.style.color = 'black';
            listNftBtn.style.cursor = 'pointer';
            listNftBtn.style.opacity = '1';
            loadTrades();
          }
        } else {
          // Fallback to Phantom
          if (!window.solana || !window.solana.isPhantom) {
            alert('Phantom wallet not found. Please install it from https://phantom.app or use a compatible Solana wallet.');
            return;
          }

          await window.solana.connect();
          connectedWallet = window.solana.publicKey.toBase58();
          walletAddrEl.textContent = `Connected: ${connectedWallet.slice(0,6)}...${connectedWallet.slice(-4)} (Phantom)`;
          connectBtn.disabled = true;
          // Enable NFT listing button and restore normal styling
          listNftBtn.disabled = false;
          listNftBtn.style.background = '#00cc33';
          listNftBtn.style.color = 'black';
          listNftBtn.style.cursor = 'pointer';
          listNftBtn.style.opacity = '1';
          loadTrades();
        }
      } catch (err) {
        console.error('[exchange] wallet connect error:', err);
        alert('Wallet connection failed: ' + (err.message || err));
      }
    });

    // Load live trades from /api/exchange/trades (public — no wallet needed)
    async function loadTrades() {
      const tradeList = document.getElementById('tradeList');
      tradeList.innerHTML = '<div class="trade-card"><h3>Loading trades...</h3></div>';
      try {
        const res = await fetch('/api/exchange/trades');
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const trades = await res.json();

        tradeList.innerHTML = '';

        if (!Array.isArray(trades) || trades.length === 0) {
          tradeList.innerHTML = '<div class="trade-card"><h3>No active trades yet. Be the first wastelander to post!</h3></div>';
          return;
        }

        trades.forEach(trade => {
          const card = document.createElement('div');
          card.className = 'trade-card';

          const titleText = trade.type === 'nft'
            ? 'NFT: ' + (trade.nftMint ? trade.nftMint.slice(0, 8) + '...' : 'Unknown')
            : trade.offer;

          const expires = trade.posted && trade.durationDays
            ? new Date(Number(trade.posted) + trade.durationDays * 86400000).toLocaleString()
            : 'Unknown';

          card.innerHTML = `
            <h3>${escapeHtml(titleText)}</h3>
            <p class="price">${escapeHtml(trade.priceFizz)} FIZZ</p>
            <p>${escapeHtml(trade.description || 'No description')}</p>
            <p>Seller: ${escapeHtml(trade.seller ? trade.seller.slice(0,6) + '...' + trade.seller.slice(-4) : '?')}</p>
            <p>Expires: ${escapeHtml(expires)}</p>
            <button class="buy-btn">Buy</button>
          `;
          card.querySelector('.buy-btn').addEventListener('click', () => buyTrade(trade.id));
          tradeList.appendChild(card);
        });
      } catch (err) {
        console.error('[exchange] Load trades failed:', err);
        tradeList.innerHTML = '<div class="trade-card"><h3>⚠ Could not load trades. Check your connection and try again.</h3></div>';
      }
    }

    // Post regular (item) trade — wallet required
    document.getElementById('newTradeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!connectedWallet) { alert('Connect your Phantom wallet first.'); return; }

      const offer = document.getElementById('offerItem').value.trim();
      const price = document.getElementById('price').value;
      const desc = document.getElementById('description').value.trim();

      try {
        const res = await fetch('/api/exchange/post-trade', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ offer, priceFizz: price, description: desc })
        });

        const data = await res.json();
        if (data.success) {
          alert('Trade posted to the exchange! ID: ' + data.tradeId);
          document.getElementById('newTradeForm').reset();
          loadTrades();
        } else {
          alert('Post failed: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        console.error('[exchange] post-trade error:', err);
        alert('Network error — could not post trade.');
      }
    });

    // List NFT — wallet required
    // Note: Uses mock NFT data until Helius DAS API integration is complete.
    // See docs/NFT_INTEGRATION_GUIDE.md for the real implementation.
    listNftBtn.addEventListener('click', async () => {
      if (!connectedWallet) { alert('Connect your Phantom wallet first.'); return; }

      const mockNfts = [
        { mint: 'ABC123mint11111111111111111111111111111111', name: 'Pocket-Boy Skin #47', image: 'https://via.placeholder.com/150/00ff41/000?text=NFT+47' },
        { mint: 'DEF456mint11111111111111111111111111111111', name: 'Vault 77 Helmet',    image: 'https://via.placeholder.com/150/00ff41/000?text=Helmet' }
      ];

      nftGrid.innerHTML = '';
      mockNfts.forEach(nft => {
        const card = document.createElement('div');
        card.className = 'nft-card';
        const img = document.createElement('img');
        img.alt = escapeHtml(nft.name);
        // Only allow images from known game CDN domains to prevent phishing via fake NFT images.
        // In production this list will expand to include the Helius/Arweave/IPFS gateway.
        const ALLOWED_IMG_ORIGINS = ['https://via.placeholder.com', 'https://arweave.net', 'https://ipfs.io'];
        const safeImgSrc = ALLOWED_IMG_ORIGINS.some(o => nft.image && nft.image.startsWith(o + '/'))
          ? nft.image
          : '';
        img.src = safeImgSrc;
        const label = document.createElement('p');
        label.textContent = nft.name;
        card.appendChild(img);
        card.appendChild(label);
        card.addEventListener('click', () => promptAndListNft(nft));
        nftGrid.appendChild(card);
      });

      nftSelector.classList.remove('hidden');
    });

    async function promptAndListNft(nft) {
      const priceStr = prompt('Price in FIZZ for ' + nft.name + '?', '1.25');
      if (!priceStr) return;

      const desc = prompt('Description (optional):', '') || '';

      try {
        const message = `List NFT ${nft.mint} for ${priceStr} FIZZ - ${desc}`;
        const signed = await window.solana.signMessage(new TextEncoder().encode(message), 'utf8');

        const res = await fetch('/api/exchange/post-nft', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nftMint: nft.mint,
            priceFizz: priceStr,
            description: desc,
            signature: bs58.encode(signed.signature)
          })
        });

        const data = await res.json();
        if (data.success) {
          alert('NFT listed! Trade ID: ' + data.tradeId);
          loadTrades();
        } else {
          alert('List failed: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        console.error('[exchange] post-nft error:', err);
        alert('Signing failed or network error.');
      }
    }

    // Buy a trade — wallet required
    async function buyTrade(tradeId) {
      if (!connectedWallet) { alert('Connect your Phantom wallet to buy trades.'); return; }

      try {
        const res = await fetch('/api/exchange/buy-trade', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tradeId })
        });

        const data = await res.json();
        if (!data.success) {
          return alert('Buy failed: ' + (data.error || 'Unknown error'));
        }

        // If a serialized transaction is returned, sign and send it (mainnet FIZZ transfer)
        if (data.serializedTx) {
          try {
            const { Transaction } = solanaWeb3;
            const tx = Transaction.from(Buffer.from(data.serializedTx, 'base64'));
            const signedTx = await window.solana.signAndSendTransaction(tx);
            console.log('[exchange] Buy tx:', signedTx.signature);
            alert('Purchase complete! Tx: ' + signedTx.signature.slice(0, 8) + '...');
          } catch (txErr) {
            console.error('[exchange] Transaction signing failed:', txErr);
            alert('Trade reserved but FIZZ transfer failed — please send ' + data.priceFizz + ' FIZZ manually to ' + data.sellerWallet);
          }
        } else {
          // Pre-mainnet: trade marked sold server-side; manual FIZZ transfer required
          alert(
            'Trade reserved!\n\n' +
            'Send ' + data.priceFizz + ' FIZZ to seller:\n' +
            data.sellerWallet + '\n\n' +
            'On-chain settlement coming in the mainnet release.'
          );
        }

        loadTrades();
      } catch (err) {
        console.error('[exchange] Buy error:', err);
        alert('Buy failed — network error.');
      }
    }

    // Load trades on page start (no wallet needed to view)
    loadTrades();
  </script>
</body>
</html>
